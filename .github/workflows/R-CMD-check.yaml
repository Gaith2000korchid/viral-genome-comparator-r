name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-linux-64.explicit.txt
          environment-name: viral-genome-comparator
          cache-environment: true
          init-shell: bash
      - name: Build and check package in the frozen environment
        shell: bash -el {0}
        run: |
          R CMD build .
          R CMD check --no-manual viralGenomeComparator_*.tar.gz
          if grep -E '^[0-9]+ (ERROR|WARNING)' viralGenomeComparator.Rcheck/00check.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-package-check
          path: viralGenomeComparator.Rcheck/
