name: v0.3 biological interpretation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "analysis/08_download_v03_panel.R"
      - "analysis/09_v03_genome_qc.R"
      - "analysis/10_v03_align_distance.R"
      - "analysis/11_v03_taxonomy_concordance.R"
      - "analysis/12_v03_conservation.R"
      - "analysis/13_v03_neighbor_joining.R"
      - "R/conservation.R"
      - "R/taxonomy_metrics.R"
      - "R/fasta_qc.R"
      - "R/alignment_metrics.R"
      - "inst/extdata/genome_manifest_v0.3.csv"
      - "inst/extdata/v0.3_panel_provenance.md"
      - ".github/workflows/v0.3-analysis.yaml"

permissions:
  contents: read

jobs:
  run-v0-3:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install analysis dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("BiocManager", "ape"))
          BiocManager::install(
            c("Biostrings", "DECIPHER"),
            ask = FALSE,
            update = FALSE
          )

      - name: Install local package
        run: R CMD INSTALL .

      - name: Run v0.3 analysis
        shell: Rscript {0}
        run: |
          library(viralGenomeComparator)
          source("analysis/08_download_v03_panel.R")
          source("analysis/09_v03_genome_qc.R")
          source("analysis/10_v03_align_distance.R")
          source("analysis/11_v03_taxonomy_concordance.R")
          source("analysis/12_v03_conservation.R")
          source("analysis/13_v03_neighbor_joining.R")

      - name: Upload v0.3 results
        uses: actions/upload-artifact@v4
        with:
          name: viral-genome-comparator-v0.3-results
          path: |
            results/v0.3_genome_qc.csv
            results/v0.3_alignment.fasta
            results/v0.3_pairwise_alignment_metrics.csv
            results/v0.3_p_distance_matrix.csv
            results/v0.3_taxonomy_concordance.csv
            results/v0.3_nearest_neighbors.csv
            results/v0.3_within_between_distance.png
            results/v0.3_site_conservation.csv
            results/v0.3_conservation_summary.csv
            results/v0.3_conservation_windows.csv
            results/v0.3_entropy_windows.png
            results/v0.3_neighbor_joining_tree.nwk
            results/v0.3_neighbor_joining_tree.png
          if-no-files-found: error
